<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Leaf 对话测试 (带日志)</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; max-width: 920px; margin: 20px auto; padding: 0 14px; background: #f4f5f7; }
  h1 { font-size: 18px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .row { margin: 6px 0; }
  label { display: inline-block; width: 80px; color: #555; font-size: 13px; }
  input, select { padding: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  input { width: 320px; } select { width: 200px; }
  #chat { height: 300px; overflow-y: auto; background: #fafafa; border: 1px solid #e3e3e3; border-radius: 8px; padding: 10px; }
  .user { color: #14532d; margin: 4px 0; }
  .bot  { color: #1e3a8a; margin: 4px 0; white-space: pre-wrap; }
  .think { color: #92400e; font-size: 12px; }
  #input { width: calc(100% - 90px); }
  button { padding: 6px 18px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button.sec { background: #64748b; }
  button:disabled { background: #aaa; }
  #log { height: 260px; overflow-y: auto; background: #0d1117; color: #c9d1d9; font-family: Consolas, monospace; font-size: 12px; padding: 10px; border-radius: 8px; white-space: pre-wrap; }
  .lg-ok  { color: #3fb950; } .lg-err { color: #f85149; } .lg-warn { color: #d29922; } .lg-dim { color: #8b949e; }
</style>
</head>
<body>
<h1>Leaf 对话测试（带完整日志）</h1>

<div class="card">
  <div class="row"><label>API 地址</label><input id="base" value="http://127.0.0.1:8000"></div>
  <div class="row"><label>API Key</label><input id="key" placeholder="鉴权已关闭, 可留空"></div>
  <div class="row"><label>模型</label>
    <select id="model">
      <option value="leaf1.0">leaf1.0（直答）</option>
      <option value="leaf-things1.0">leaf-things1.0（思考）</option>
      <option value="leaf-flash">leaf-flash（多模态）</option>
      <option value="leaf-code">leaf-code（代码）</option>
    </select>
    <button class="sec" onclick="testHealth()">测试 /health</button>
    <button class="sec" onclick="testModels()">拉取模型列表</button>
    <label style="width:auto"><input type="checkbox" id="stream" style="width:auto" checked> 流式</label>
  </div>
</div>

<div class="card">
  <div id="chat"></div>
  <div class="row" style="margin-top:8px">
    <input id="input" placeholder="输入消息，回车发送" onkeydown="if(event.key==='Enter')send()">
    <button id="send" onclick="send()">发送</button>
    <button class="sec" onclick="document.getElementById('chat').innerHTML=''">清屏</button>
  </div>
</div>

<div class="card">
  <b>📋 日志</b>（每次请求的完整过程；报错红色）
  <button class="sec" style="float:right" onclick="document.getElementById('log').textContent=''">清空日志</button>
  <div id="log"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const now = () => new Date().toLocaleTimeString('zh-CN', {hour12: false});

function log(msg, cls) {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = '[' + now() + '] ' + msg;
  $('log').appendChild(div);
  $('log').scrollTop = $('log').scrollHeight;
}
function chatLine(cls, text) {
  const div = document.createElement('div');
  div.className = cls; div.textContent = text;
  $('chat').appendChild(div); $('chat').scrollTop = $('chat').scrollHeight;
  return div;
}

let history = [];

window.onload = () => {
  log('页面已加载。点击「测试 /health」验证连通性。', 'lg-dim');
  testHealth();
};

async function testHealth() {
  const base = $('base').value.replace(/\/+$/, '');
  log('GET ' + base + '/health');
  const t0 = performance.now();
  try {
    const r = await fetch(base + '/health');
    const d = await r.json();
    log('HTTP ' + r.status + ' (' + (performance.now()-t0).toFixed(0) + 'ms) 状态=' + d.status +
        ' 模型=' + JSON.stringify(d.models), 'lg-ok');
  } catch (e) {
    log('失败: ' + e.message + ' —— 服务器没启动？地址错误？防火墙？', 'lg-err');
  }
}

async function testModels() {
  const base = $('base').value.replace(/\/+$/, '');
  const url = base + '/v1/models';
  log('GET ' + url);
  const t0 = performance.now();
  try {
    const headers = {'Content-Type': 'application/json'};
    if ($('key').value) headers['Authorization'] = 'Bearer ' + $('key').value;
    const r = await fetch(url, {headers});
    const text = await r.text();
    log('HTTP ' + r.status + ' (' + (performance.now()-t0).toFixed(0) + 'ms) 响应: ' + text.slice(0, 300),
        r.ok ? 'lg-ok' : 'lg-err');
  } catch (e) {
    log('失败: ' + e.message, 'lg-err');
  }
}

async function send() {
  const q = $('input').value.trim();
  if (!q) return;
  $('input').value = '';
  const base = $('base').value.replace(/\/+$/, '');
  const model = $('model').value;
  const stream = $('stream').checked;
  history.push({role: 'user', content: q});
  if (history.length > 6) history = history.slice(-6);
  chatLine('user', '你: ' + q);
  const botDiv = chatLine('bot', '小强: …');

  const url = base + '/v1/chat/completions';
  const body = { model, stream, max_tokens: 512,
                 messages: history.slice() };
  log('POST ' + url + ' | model=' + model + ' | stream=' + stream +
      ' | 消息数=' + body.messages.length + ' | 请求体: ' + JSON.stringify(body).slice(0, 260));
  const headers = {'Content-Type': 'application/json'};
  if ($('key').value) headers['Authorization'] = 'Bearer ' + $('key').value;
  const t0 = performance.now();
  $('send').disabled = true;
  try {
    const resp = await fetch(url, {method: 'POST', headers, body: JSON.stringify(body)});
    log('HTTP ' + resp.status + ' ' + resp.statusText, resp.ok ? 'lg-ok' : 'lg-err');
    if (!resp.ok) {
      const text = await resp.text();
      log('错误响应体: ' + text, 'lg-err');
      botDiv.textContent = '小强: (请求失败 HTTP ' + resp.status + '，见日志)';
      return;
    }
    let full = '', fullThink = '';
    if (!stream) {
      const d = await resp.json();
      fullThink = d.choices[0].message.reasoning_content || '';
      full = d.choices[0].message.content || '';
      log('非流式响应 (' + (performance.now()-t0).toFixed(0) + 'ms): ' +
          JSON.stringify(d).slice(0, 260), 'lg-dim');
    } else {
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          const t = line.trim();
          if (!t.startsWith('data:')) { if (t) log('非SSE行: ' + t.slice(0, 120), 'lg-warn'); continue; }
          const payload = t.slice(5).trim();
          if (payload === '[DONE]') { log('SSE: [DONE]', 'lg-dim'); continue; }
          try {
            const d = JSON.parse(payload);
            const delta = d.choices[0].delta || {};
            if (delta.reasoning_content) fullThink += delta.reasoning_content;
            if (delta.content) full += delta.content;
          } catch (e) { log('SSE 解析失败: ' + t.slice(0, 120), 'lg-err'); }
        }
      }
      log('流式完成 (' + (performance.now()-t0).toFixed(0) + 'ms) 共 ' + full.length + ' 字', 'lg-ok');
    }
    botDiv.innerHTML = '小强: ' +
      (fullThink ? '<span class="think">[思考] ' + fullThink + '</span>\n' : '') +
      (full || '(空响应!)');
    if (!full) log('警告: content 为空! think=' + fullThink.length + ' 字。响应体见上方日志。', 'lg-err');
    history.push({role: 'assistant', content: full});
  } catch (e) {
    log('请求异常: ' + e.message, 'lg-err');
    botDiv.textContent = '小强: (请求异常: ' + e.message + ')';
  } finally {
    $('send').disabled = false;
  }
}
</script>
</body>
</html>
